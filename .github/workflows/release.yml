name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated semantic or revision release tag
        required: true
        type: string
      expected_sha:
        description: Accepted main commit recorded by the tag workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Fetch accepted main for release ancestry proof
        run: git fetch origin refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use repository npm
        shell: bash
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          expected_npm="${package_manager#npm@}"
          npm install --global "$package_manager"
          actual_npm="$(npm --version)"
          [ "$actual_npm" = "$expected_npm" ] || { echo "::error::npm $actual_npm != repository npm $expected_npm"; exit 1; }
      - run: npm ci
      - run: npm run check
      - name: Network dependency advisories
        run: npm run audit:dependencies
      - name: Load release guard from this workflow commit
        run: |
          mkdir -p "$RUNNER_TEMP/sharktank-release-tools/scripts"
          git show "$GITHUB_SHA:scripts/release-identity.mjs" > "$RUNNER_TEMP/sharktank-release-tools/scripts/release-identity.mjs"
      - name: Verify exact release identity
        env:
          SHARKTANK_RELEASE: ${{ inputs.tag }}
          SHARKTANK_EXPECTED_SHA: ${{ inputs.expected_sha }}
          SHARKTANK_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node "$RUNNER_TEMP/sharktank-release-tools/scripts/release-identity.mjs"

  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Fetch accepted main for release ancestry proof
        run: git fetch origin refs/heads/main:refs/remotes/origin/main
      - name: Load publication guards from this workflow commit
        run: |
          mkdir -p "$RUNNER_TEMP/sharktank-release-tools/scripts"
          git show "$GITHUB_SHA:scripts/release-identity.mjs" > "$RUNNER_TEMP/sharktank-release-tools/scripts/release-identity.mjs"
          git show "$GITHUB_SHA:scripts/release-publication.mjs" > "$RUNNER_TEMP/sharktank-release-tools/scripts/release-publication.mjs"
      - name: Reverify exact release identity before publication
        env:
          SHARKTANK_RELEASE: ${{ inputs.tag }}
          SHARKTANK_EXPECTED_SHA: ${{ inputs.expected_sha }}
          SHARKTANK_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node "$RUNNER_TEMP/sharktank-release-tools/scripts/release-identity.mjs"
      - name: Create or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHARKTANK_RELEASE: ${{ inputs.tag }}
          SHARKTANK_EXPECTED_SHA: ${{ inputs.expected_sha }}
          SHARKTANK_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node "$RUNNER_TEMP/sharktank-release-tools/scripts/release-publication.mjs"

  deploy-production:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish-release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ inputs.tag }}
      expected_sha: ${{ inputs.expected_sha }}
    secrets: inherit
