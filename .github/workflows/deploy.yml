name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Published immutable release identity tag from the calling Release workflow
        required: true
        type: string
      expected_sha:
        description: Exact accepted main commit of the published tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: sharktank-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Fetch accepted main for release ancestry proof
        run: git fetch origin refs/heads/main:refs/remotes/origin/main
      - name: Load deployment guards from the caller workflow commit
        run: |
          mkdir -p "$RUNNER_TEMP/sharktank-release-tools/scripts"
          git show "$GITHUB_SHA:scripts/release-identity.mjs" > "$RUNNER_TEMP/sharktank-release-tools/scripts/release-identity.mjs"
          git show "$GITHUB_SHA:scripts/deploy-prod.mjs" > "$RUNNER_TEMP/sharktank-release-tools/scripts/deploy-prod.mjs"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use repository npm
        shell: bash
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          expected_npm="${package_manager#npm@}"
          npm install --global "$package_manager"
          actual_npm="$(npm --version)"
          [ "$actual_npm" = "$expected_npm" ] || { echo "::error::npm $actual_npm != repository npm $expected_npm"; exit 1; }
      - run: npm ci
      - name: Verify release handoff
        env:
          SHARKTANK_RELEASE: ${{ inputs.tag }}
          SHARKTANK_EXPECTED_SHA: ${{ inputs.expected_sha }}
          SHARKTANK_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "::error::production deploy requires a dispatched release"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::production deploy requires the main release workflow"; exit 1; }
          node "$RUNNER_TEMP/sharktank-release-tools/scripts/release-identity.mjs"
      - name: Deploy the exact release tag
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARKTANK_RELEASE: ${{ inputs.tag }}
          SHARKTANK_EXPECTED_SHA: ${{ inputs.expected_sha }}
          SHARKTANK_RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          SHARKTANK_RELEASE_CHECKOUT: ${{ github.workspace }}
        run: |
          set -o pipefail
          node "$RUNNER_TEMP/sharktank-release-tools/scripts/deploy-prod.mjs" 2>&1 | tee /tmp/deploy.log
          version=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/deploy.log | tail -1)
          [ -n "$version" ] || { echo "::error::could not read the deployed Version ID from wrangler output"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The gate. sharktank.wizardgang.ai answers a runner with 403 and
      # `cf-mitigated: challenge`, so nothing that fetches the public site can verify a
      # deploy from CI. The authenticated Cloudflare API is not challenged.
      - name: Confirm the uploaded version is live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          npx wrangler deployments list --env wizardgangprod > /tmp/deployments.txt 2>&1 || {
            cat /tmp/deployments.txt; echo "::error::could not list deployments"; exit 1; }
          newest=$(grep -E '^Version\(s\):' /tmp/deployments.txt | tail -1)
          echo "newest deployment: $newest"
          printf '%s' "$newest" | grep -q "$VERSION" \
            || { echo "::error::the live deployment is not $VERSION"; exit 1; }
          printf '%s' "$newest" | grep -q '(100%)' \
            || { echo "::error::$VERSION is not serving 100% of traffic"; exit 1; }
          echo "Production is serving $VERSION at 100%"

      # Best effort, for the same reason. These checks read the public site, so they are
      # unreachable from CI until a WAF skip rule exists. When the edge does answer, a
      # wrong release still fails the run.
      - name: Public identity checks
        env:
          SHARKTANK_RELEASE: ${{ inputs.tag }}
        run: |
          code=$(curl -s -o /tmp/version.json -D /tmp/headers.txt -w '%{http_code}' https://sharktank.wizardgang.ai/version.json || echo 000)
          if [ "$code" = "200" ]; then
            product_release="${SHARKTANK_RELEASE%%-r*}"
            live_product=$(jq -r .release < /tmp/version.json)
            live_revision=$(jq -r .revision < /tmp/version.json)
            [ "$live_product" = "$product_release" ] \
              || { echo "::error::production product release $live_product != $product_release"; exit 1; }
            [ "$live_revision" = "$SHARKTANK_RELEASE" ] \
              || { echo "::error::production revision $live_revision != $SHARKTANK_RELEASE"; exit 1; }
            echo "Public product identity $live_product matches immutable revision $live_revision"

            play_code=$(curl -s -o /tmp/play.html -w '%{http_code}' https://sharktank.wizardgang.ai/play/ || echo 000)
            [ "$play_code" = "200" ] \
              || { echo "::error::public /play/ returned HTTP $play_code"; exit 1; }
            asset=$(grep -oE '/assets/[^" ]+\.js' /tmp/play.html | head -1)
            [ -n "$asset" ] \
              || { echo "::error::public /play/ did not reference a built JavaScript asset"; exit 1; }
            asset_code=$(curl -s -o /dev/null -w '%{http_code}' "https://sharktank.wizardgang.ai$asset" || echo 000)
            [ "$asset_code" = "200" ] \
              || { echo "::error::public full-3D asset $asset returned HTTP $asset_code"; exit 1; }
            echo "Public /play/ serves the exact deployed build asset $asset"

          elif grep -qi '^cf-mitigated: *challenge' /tmp/headers.txt; then
            echo "::warning::sharktank.wizardgang.ai issued a Cloudflare managed challenge to this runner (HTTP $code), so the public identity and /play/ asset checks could not run. The deployment was already proven above. Add a WAF skip rule to restore these checks."
          else
            echo "::warning::could not read /version.json (HTTP $code); the deployment was proven above"
          fi
